name: Perfil · estadísticas y snake

# Genera las tarjetas de estadísticas y la animación de contribuciones y las
# publica en la rama `output`, de donde las lee el README.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/src/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tarjetas de estadísticas
        run: python3 scripts/github_stats.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0891b2
            dist/snake-dark.svg?palette=github-dark&color_snake=#00d1ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: actualizar estadísticas del perfil"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
